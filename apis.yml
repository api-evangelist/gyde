aid: gyde
name: Gyde
description: >-
  Gyde is an AI-native health insurance brokerage, founded in 2025 and
  headquartered in Austin, Texas with an office in New York City. Gyde partners
  with established insurance agencies through acquisition, embedding AI-powered
  tools and operational support so brokers can guide clients through insurance,
  health, and wealth decisions at greater scale. Its products include Gia, an AI
  assistant that handles client outreach, scheduling, and questions over SMS and
  voice around the clock, and GydeOS, a broker operating system providing client
  summaries, conversation transcripts, campaign management, and an AI co-pilot.
  Gyde launched publicly in January 2026 with $60M in financing led by Lightspeed
  Venture Partners. The company does not currently publish a public API,
  developer portal, or SDKs; this profile tracks its identity and public web
  properties in the API Evangelist network.
